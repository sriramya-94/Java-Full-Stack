<!DOCTYPE html>
<html>
<head>
    <title>Transform Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background: blue;
            margin: 100px;
            transition: 1s;
        }

        .box:hover {
            transform: rotate(45deg) scale(1.3);
        }
    </style>
</head>

<body>

<h1>Transform Animation</h1>

<div class="box"></div>

</body>
</html>
