<!DOCTYPE html>
<html>
<head>
    <title>CSS Animation</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background: blue;
            animation: move 3s infinite;
        }

        @keyframes move {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(300px);
            }
        }
    </style>
</head>
<body>

<h1>Basic Animation</h1>

<div class="box"></div>

</body>
</html>
